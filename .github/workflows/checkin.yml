name: Qoder Daily Checkin

# 北京时间每天 10:10 = UTC 02:10。GitHub cron 用 UTC，且高峰可能延迟几分钟。
on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch: {}        # 允许手动触发（首次部署后先手动跑一次验证）

permissions:
  contents: read

concurrency:
  group: qoder-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull state from private gist
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python gist_store.py pull

      - name: Run checkin
        run: python qoder_checkin.py

      # 无论签到成功与否都回写，确保刷新轮换后的 token 不丢
      - name: Push state back to gist
        if: always()
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python gist_store.py push