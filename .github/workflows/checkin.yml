name: Qoder Daily Checkin

# GitHub cron 用 UTC，且 schedule 是「尽力而为」：高峰会延迟甚至丢弃（实测曾延迟 7 小时）。
# 因此设多个时段兜底：北京 10:10/11:10/13:10/15:10/19:10。领取幂等，首次成功后其余仅报「已领取」。
# 分钟统一用 :10，避开整点高负载。
on:
  schedule:
    - cron: "10 2 * * *"    # 北京 10:10（主）
    - cron: "10 3 * * *"    # 北京 11:10
    - cron: "10 5 * * *"    # 北京 13:10
    - cron: "10 7 * * *"    # 北京 15:10
    - cron: "10 11 * * *"   # 北京 19:10
  workflow_dispatch: {}        # 允许手动触发（首次部署后先手动跑一次验证）

permissions:
  contents: read

concurrency:
  group: qoder-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull state from private gist
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python gist_store.py pull

      - name: Run checkin
        run: python qoder_checkin.py

      # 无论签到成功与否都回写，确保刷新轮换后的 token 不丢
      - name: Push state back to gist
        if: always()
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python gist_store.py push